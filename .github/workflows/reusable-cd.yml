name: CD

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  detect:
    if: github.ref == 'refs/heads/main
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect_stack.outputs.stack }}
      stack_version: ${{ steps.detect_stack.outputs.stack_version }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect tech stack
        id: detect_stack
        uses: ArchBoot/reusables-actions/.github/actions/detect-stack@feature/JAGT-actions

      - name: Setup environment
        uses: ArchBoot/reusables-actions/.github/actions/setup-environment@feature/JAGT-actions
        with:
          stack: ${{ steps.detect_stack.outputs.stack }}
          stack_version: ${{ steps.detect_stack.outputs.stack_version }}

      - name: Get version
        id: get_version
        uses: ArchBoot/reusables-actions/.github/actions/get-version@feature/JAGT-actions
        with:
          stack: ${{ steps.detect_stack.outputs.stack }}

  deploy:
    needs: detect
    if: github.ref == 'refs/heads/main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Dockerfile
        id: dockerfile
        uses: ArchBoot/reusables-actions/.github/actions/generate-dockerfile@feature/JAGT-actions
        with:
          stack: ${{ needs.detect.outputs.stack }}

      - name: Build docker image
        uses: ArchBoot/reusables-actions/.github/actions/docker-build@feature/JAGT-actions
        with:
          image_name: ${{ github.repository_owner }}-${{ github.event.repository.name }}
          image_tag: ${{ needs.detect.outputs.version }}
          dockerfile: ${{ steps.dockerfile.outputs.dockerfile }}

      - name: Docker Hub Login
        if: env.USE_DOCKER_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: env.USE_DOCKER_HUB == 'true'
        shell: bash
        run: |
          docker tag  \
            "${{ github.repository_owner }}-${{ github.event.repository.name }}:${{ needs.detect.outputs.version }}" \
            "${{ github.repository_owner }}-${{ github.event.repository.name }}:${{ needs.detect.outputs.version }}"
          
          docker push "${{ github.repository_owner }}-${{ github.event.repository.name }}:${{ needs.detect.outputs.version }}"

      - name: Deploy VPS
        uses: ArchBoot/reusables-actions/.github/actions/deploy-vps@feature/JAGT-actions
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          ssh_private_key: ${{ secrets.VPS_SSH_PROBATE_KRY }}
          image: ${{ github.repository_owner }}-${{ github.event.repository.name }}:${{ needs.detect.outputs.version }}
          app_name: ${{ github.repository_owner }}-${{ github.event.repository.name }}
          deploy_path: ${{ env.DEPLOY_PATH }}
          domain: ${{ env.APP_DOMAIN }}
          container_port: ${{ env.CONTAINER_PORT }}
          use_docker_hub: ${{ env.USE_DOCKER_HUB }}
